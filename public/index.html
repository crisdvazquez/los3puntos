<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los 3 Puntos</title>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>LOS 3 PUNTOS: Sonríe la caprichosa.</h1>
    <p class="subtitle">Resultados, fixtures y tablas de las principales ligas</p>
    
    <!-- Solapas Ligas -->
    <div class="tabs">
      <button class="tab-btn active" data-liga="PL"><img src="https://flagcdn.com/gb-eng.svg" class="flag-img"> Premier League</button>
      <button class="tab-btn" data-liga="PD"><img src="https://flagcdn.com/es.svg" class="flag-img"> LaLiga</button>
      <button class="tab-btn" data-liga="SA"><img src="https://flagcdn.com/it.svg" class="flag-img"> Serie A</button>
      <button class="tab-btn" data-liga="BL1"><img src="https://flagcdn.com/de.svg" class="flag-img"> Bundesliga</button>
      <button class="tab-btn" data-liga="ARG"><img src="https://flagcdn.com/ar.svg" class="flag-img"> LPF Arg</button>
    </div>

    <!-- Banner Liga -->
    <div id="league-header"></div>

    <!-- Dashboard 2 Columnas -->
    <div class="dashboard-grid">
      <!-- Izquierda: Tabla de Posiciones -->
      <div class="panel">
        <div class="panel-title">Tabla de Posiciones</div>
        <div id="posiciones-container" class="loading">Cargando posiciones...</div>
      </div>

      <!-- Derecha: Fixture y Fechas -->
      <div class="panel">
        <div class="nav-fechas">
          <button id="btn-prev-fecha" class="btn-nav">« Anterior</button>
          <select id="select-jornada" disabled><option>Cargando...</option></select>
          <button id="btn-next-fecha" class="btn-nav">Siguiente »</button>
        </div>
        <div id="partidos" class="loading">Cargando partidos...</div>
      </div>
    </div>
  </div>

  <script src="js/ligas.js"></script>
  <script src="js/adaptadores.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
