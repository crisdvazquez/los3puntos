<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOS 3 PUNTOS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/css/flag-icon.min.css">
    
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --text-color: #e0fbfc;
            --text-muted: #8d99ae;
            --border-color: #3a506b;
            --accent-color: #6fffe9;
            --live-color: #ff3b30;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            font-size: 10.5px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        /* Layout general de la aplicación en dos columnas (Sidebar Izquierda + Contenido) */
        .layout-app {
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 20px;
            max-width: 1450px;
            margin: 0 auto;
            align-items: start;
        }

        /* Menú de Ligas en columna izquierda */
        .menu-ligas {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            position: sticky;
            top: 20px;
        }

        .tab-btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
        }

        .tab-btn:hover { background-color: var(--border-color); }
        .tab-btn.active {
            background-color: var(--border-color);
            border-color: var(--accent-color);
            color: var(--accent-color);
            font-weight: bold;
        }

        .flag-icon {
            width: 18px;
            height: 13px;
            border-radius: 2px;
            object-fit: cover;
            flex-shrink: 0;
        }

        /* Contenedor derecho para banner y contenido principal */
        .main-panel {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .league-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            text-align: center;
        }

        .league-logo {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .league-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .contenido {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 1250px;
            margin: 0 auto;
            width: 100%;
        }

        @media (min-width: 950px) {
            .contenido.liga-view { flex-direction: row; align-items: flex-start; }
            .contenido.liga-view .seccion-tabla { flex: 1.4; display: block; }
            .contenido.liga-view .seccion-partidos { flex: 1.1; }
        }

        .seccion-tabla { display: block; }
        .oculto { display: none !important; }

        h2 {
            font-size: 1.1rem;
            color: var(--accent-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 0;
        }

        .fixture-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .fixture-btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .fixture-btn:hover { background-color: var(--border-color); }

        .fixture-select {
            background-color: var(--bg-color);
            color: var(--accent-color);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            font-size: 0.8rem;
        }

        th, td { 
            padding: 8px 4px; 
            text-align: center; 
            border-bottom: 1px solid var(--border-color); 
        }
        
        th { 
            background-color: rgba(0,0,0,0.2); 
            color: var(--text-muted); 
            font-weight: 600; 
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        .match-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .match-date-col {
            text-align: center;
            min-width: 60px;
            font-size: 0.7rem;
            color: var(--text-muted);
            border-right: 1px solid var(--border-color);
            padding-right: 8px;
        }

        .match-teams-col {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex: 1;
            padding-left: 12px;
        }

        .team-home {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-start;
            flex: 1;
            text-align: left;
        }

        .team-away {
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: flex-end;
            flex: 1;
            text-align: right;
        }

        .team-badge {
            width: 20px;
            height: 20px;
            object-fit: contain;
            flex-shrink: 0;
            margin: 0 2px !important;
        }

        .match-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 0 4px;
            min-width: 60px;
        }

        .vs-text {
            font-weight: bold;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        .score-box {
            font-weight: bold;
            background-color: var(--bg-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .badge-live {
            color: var(--live-color);
            font-weight: bold;
            font-size: 0.65rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Adaptación para pantallas pequeñas / celulares */
        @media (max-width: 900px) {
            .layout-app {
                grid-template-columns: 1fr;
            }
            .menu-ligas {
                position: relative;
                top: 0;
                flex-direction: row;
                overflow-x: auto;
                padding: 8px;
            }
            .tab-btn {
                width: auto;
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>LOS 3 PUNTOS: Sonríe la caprichosa</h1>
        <p class="subtitle">Resultados de las principales ligas del mundo</p>
    </header>

    <!-- Contenedor Principal en Grid que separa la barra lateral y el contenido -->
    <div class="layout-app">

        <!-- Menú de Ligas a la Izquierda -->
        <div class="menu-ligas">
            <button class="tab-btn active" data-liga="HOME">🏠 Partidos de Hoy</button>
            <button class="tab-btn" data-liga="PL"><span class="flag-icon flag-icon-gb-eng"></span> Premier League</button>
            <button class="tab-btn" data-liga="PD"><span class="flag-icon flag-icon-es"></span> LaLiga</button>
            <button class="tab-btn" data-liga="SA"><span class="flag-icon flag-icon-it"></span> Serie A</button>
            <button class="tab-btn" data-liga="BL1"><span class="flag-icon flag-icon-de"></span> Bundesliga</button>
            <button class="tab-btn" data-liga="FL1"><span class="flag-icon flag-icon-fr"></span> Ligue 1</button>
            <button class="tab-btn" data-liga="CL"><span class="flag-icon flag-icon-eu"></span> Champions</button>
            <button class="tab-btn" data-liga="ARG"><span class="flag-icon flag-icon-ar"></span> Argentina</button>
        </div>

        <!-- Panel Derecho con Banner, Tabla y Fixture -->
        <div class="main-panel">
            <div class="league-banner">
                <img id="league-logo" src="" alt="" class="league-logo" style="display:none;">
                <h2 id="league-title" class="league-title">Partidos de Hoy</h2>
            </div>

            <div id="contenedor-principal" class="contenido">
                
                <div id="seccion-tabla-wrapper" class="seccion-tabla">
                    <h2>Tabla de Posiciones</h2>
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 25px;">#</th>
                                <th style="text-align:left;">Equipo</th>
                                <th style="color:var(--accent-color);">Pts</th>
                                <th>GF</th>
                                <th>GC</th>
                                <th>+/-</th>
                                <th>PG</th>
                                <th>PE</th>
                                <th>PP</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-posiciones"></tbody>
                    </table>
                </div>

                <div class="seccion-partidos" style="flex: 1; width: 100%;">
                    <div id="fixture-controles-wrapper">
                        <h2>Partidos y Fixture</h2>
                        <div class="fixture-header">
                            <button id="btn-prev-round" class="fixture-btn">&larr; Anterior</button>
                            <select id="select-round" class="fixture-select"></select>
                            <button id="btn-next-round" class="fixture-btn">Siguiente &rarr;</button>
                        </div>
                    </div>

                    <div id="partidos-container"></div>
                </div>

            </div>
        </div>

    </div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
