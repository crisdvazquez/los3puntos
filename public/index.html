<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Los 3 Puntos</title>
  <!-- Rutas absolutas a la carpeta public -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container">
    <h1>LOS 3 PUNTOS</h1>
    <p class="subtitle">Estadísticas y Fixture en Vivo</p>

    <!-- Solapas Ligas -->
    <div class="tabs">
      <button class="tab-btn active" data-liga="PL" data-season="2026"><img src="https://flagcdn.com/w20/gb-eng.png" class="flag-img" alt="ENG"> Premier League</button>
      <button class="tab-btn" data-liga="PD" data-season="2026"><img src="https://flagcdn.com/w20/es.png" class="flag-img" alt="ESP"> LaLiga</button>
      <button class="tab-btn" data-liga="SA" data-season="2026"><img src="https://flagcdn.com/w20/it.png" class="flag-img" alt="ITA"> Serie A</button>
      <button class="tab-btn" data-liga="BL1" data-season="2026"><img src="https://flagcdn.com/w20/de.png" class="flag-img" alt="GER"> Bundesliga</button>
      <button class="tab-btn" data-liga="LPF" data-season="2026"><img src="https://flagcdn.com/w20/ar.png" class="flag-img" alt="ARG"> LPF Arg</button>
    </div>

    <!-- Banner Liga -->
    <div class="league-banner">
      <img id="league-logo" src="" alt="" class="league-logo-img">
      <h2 id="league-title" class="league-title">Cargando...</h2>
    </div>

    <!-- Layout Principal -->
    <div class="dashboard-grid">
      <!-- Tabla Posiciones -->
      <div class="panel">
        <h3 class="panel-title">Tabla de Posiciones</h3>
        <div class="table-container">
          <table class="standings-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Equipo</th>
                <th>PJ</th>
                <th>DIF</th>
                <th>PTS</th>
              </tr>
            </thead>
            <tbody id="tabla-posiciones">
              <!-- Carga dinámica -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Partidos -->
      <div class="panel">
        <h3 class="panel-title">Partidos y Fechas</h3>
        <div class="nav-fechas">
          <button id="btn-prev-fecha" class="btn-nav">&lt; Anterior</button>
          <select id="select-jornada"></select>
          <button id="btn-next-fecha" class="btn-nav">Siguiente &gt;</button>
        </div>
        <div id="partidos-container">
          <!-- Carga dinámica -->
        </div>
      </div>
    </div>
  </div>

  <script src="/js/ui.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
