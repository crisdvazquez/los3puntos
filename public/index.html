<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Los 3 Puntos - Fútbol en Vivo y Posiciones</title>
    <!-- Librería de banderas para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/css/flag-icon.min.css">
    
    <style>
        /* Estilos Generales y Escala Compacta */
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --bg-table-header: #2a2a2a;
            --border-color: #333;
            --text-color: #e0e0e0;
            --text-muted: #999;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
        }

        html {
            font-size: 13px; /* Escala reducida en general para ganar espacio */
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--bg-card);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
            color: #fff;
        }

        /* Contenedor Principal en Grid: Menú Lateral Izquierdo + Contenido */
        .app-container {
            display: grid;
            grid-template-columns: 210px 1fr; /* Columna izquierda fija de 210px para solapas */
            gap: 15px;
            padding: 15px;
            max-width: 1450px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            flex: 1;
        }

        /* Menú de Solapas Lateral Izquierdo */
        .tabs-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--bg-card);
            padding: 12px;
            border-radius: 8px;
            height: fit-content;
            border: 1px solid var(--border-color);
        }

        .tab-btn {
            text-align: left;
            padding: 10px 12px;
            font-size: 0.95rem;
            border: none;
            background: transparent;
            color: var(--text-color);
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #fff;
            font-weight: bold;
        }

        /* Contenido Principal (Tablas + Fixture) */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tab-content {
            display: none;
            flex-direction: column;
            gap: 15px;
        }

        .tab-content.active {
            display: flex;
        }

        /* Diseño de Tarjetas / Paneles */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            box-sizing: border-box;
        }

        .card h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.1rem;
            color: #fff;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        /* Tablas Compactas */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.82rem;
            text-align: left;
        }

        th, td {
            padding: 5px 7px !important;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--bg-table-header);
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .team-cell {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .team-badge {
            width: 18px;
            height: 18px;
            object-fit: contain;
        }

        /* Controles de Fechas / Fixture */
        .fixture-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
            flex-wrap: wrap;
        }

        select {
            background: var(--bg-main);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        /* Lista de Partidos / Eventos */
        .match-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .match-item {
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .match-teams {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-right: 15px;
        }

        .match-info {
            text-align: center;
            min-width: 70px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .match-score {
            font-weight: bold;
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Responsive para dispositivos móviles */
        @media (max-width: 900px) {
            .app-container {
                grid-template-columns: 1fr; /* Columna única vertical si la pantalla es chica */
            }
            .tabs-container {
                flex-direction: row;
                overflow-x: auto;
                width: 100%;
                padding: 8px;
            }
            .tab-btn {
                white-space: nowrap;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Los 3 Puntos ⚽</h1>
    </header>

    <div class="app-container">
        <!-- Menú Lateral Izquierdo de Solapas -->
        <div class="tabs-container" id="sidebar-tabs">
            <button class="tab-btn active" onclick="switchTab('arg')">🇦🇷 Argentina</button>
            <button class="tab-btn" onclick="switchTab('premier')">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</button>
            <button class="tab-btn" onclick="switchTab('laliga')">🇪🇸 La Liga</button>
            <button class="tab-btn" onclick="switchTab('seriea')">🇮🇹 Serie A</button>
            <button class="tab-btn" onclick="switchTab('bundesliga')">🇩🇪 Bundesliga</button>
            <button class="tab-btn" onclick="switchTab('champions')">🇪🇺 Champions League</button>
        </div>

        <!-- Contenido Principal -->
        <div class="main-content">
            
            <!-- Solapa Argentina -->
            <div id="tab-arg" class="tab-content active">
                <div class="card">
                    <h3>Tabla de Posiciones - Argentina</h3>
                    <div class="table-responsive" id="arg-standings-container">
                        <!-- Aquí se inyecta dinámicamente la tabla -->
                    </div>
                </div>
                <div class="card">
                    <div class="fixture-controls">
                        <h3 style="margin:0; border:none;">Fixture / Partidos</h3>
                        <select id="arg-round-select" onchange="cambiarJornadaArg(this.value)">
                            <!-- Opciones de fechas -->
                        </select>
                    </div>
                    <div class="match-list" id="arg-fixtures-container">
                        <!-- Aquí se inyectan los partidos -->
                    </div>
                </div>
            </div>

            <!-- Solapa Premier League -->
            <div id="tab-premier" class="tab-content">
                <div class="card">
                    <h3>Tabla de Posiciones - Premier League</h3>
                    <div class="table-responsive" id="premier-standings-container"></div>
                </div>
            </div>

            <!-- Solapa La Liga -->
            <div id="tab-laliga" class="tab-content">
                <div class="card">
                    <h3>Tabla de Posiciones - La Liga</h3>
                    <div class="table-responsive" id="laliga-standings-container"></div>
                </div>
            </div>

            <!-- Solapa Serie A -->
            <div id="tab-seriea" class="tab-content">
                <div class="card">
                    <h3>Tabla de Posiciones - Serie A</h3>
                    <div class="table-responsive" id="seriea-standings-container"></div>
                </div>
            </div>

            <!-- Solapa Bundesliga -->
            <div id="tab-bundesliga" class="tab-content">
                <div class="card">
                    <h3>Tabla de Posiciones - Bundesliga</h3>
                    <div class="table-responsive" id="bundesliga-standings-container"></div>
                </div>
            </div>

            <!-- Solapa Champions League -->
            <div id="tab-champions" class="tab-content">
                <div class="card">
                    <h3>Tabla de Posiciones - Champions League</h3>
                    <div class="table-responsive" id="champions-standings-container"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Función para cambiar de solapa activa en la interfaz
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabId}`).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function cambiarJornadaArg(round) {
            // Lógica existente de tu app para actualizar partidos por fecha seleccionada
        }
    </script>
</body>
</html>
